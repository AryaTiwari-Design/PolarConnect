services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -r backend/requirements.txt && uvicorn backend.app.main:app --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
      - POLARCONNECT_DB=/app/backend/polarconnect.db
      - JWT_SECRET=change_this_secret
    depends_on:
      - ai-service

  ai-service:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -r ai/requirements.txt && uvicorn ai.service.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
